
<!DOCTYPE html>
<html lang="bn">
<head>

    <link rel="icon" type="image/jpg" 
    href="45c24e4c-a347-4288-a133-0f812d700828.jpg">
    <link rel="manifest" 
    href="45c24e4c-a347-4288-a133-0f812d700828.jpg">
    <meta name="theme-color" content="#0b1020">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFS TalkBD - Smart Chatbot</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1020;
 color:white;
}
header{
 height:65px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 background:#111a30;
 border-bottom:1px solid #26334d;
}
.logo{font-size:23px;font-weight:bold;color:#65a9ff}
.logo span{color:white}
.status{font-size:11px;color:#69e6a2}
.container{
 max-width:850px;
 margin:auto;
 padding:15px;
}
.welcome{
 text-align:center;
 margin:35px 0 25px;
}
.welcome h1{font-size:30px;margin-bottom:8px}
.welcome p{color:#9baac4}
#chat{
 height:calc(100vh - 300px);
 min-height:280px;
 overflow-y:auto;
 padding:12px 2px;
}
.msg{
 max-width:85%;
 padding:13px 16px;
 margin:12px 0;
 border-radius:15px;
 line-height:1.6;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#2469ce;
 margin-left:auto;
 border-bottom-right-radius:3px;
}
.bot{
 background:#1b2942;
 margin-right:auto;
 border-bottom-left-radius:3px;
}
.bot small{color:#69aaff;font-weight:bold}
.input-area{
 position:sticky;
 bottom:0;
 background:#0b1020;
 padding:12px 0;
}
.input-box{
 display:flex;
 gap:8px;
 background:#17243b;
 border:1px solid #344764;
 padding:8px;
 border-radius:15px;
}
input{
 flex:1;
 min-width:0;
 border:0;
 outline:0;
 background:transparent;
 color:white;
 font-size:16px;
 padding:10px;
}
button{
 border:0;
 cursor:pointer;
 border-radius:10px;
 padding:11px 16px;
 font-weight:bold;
}
#send{background:#2879ed;color:white}
#clear{background:#293a55;color:white}
.actions{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:10px;
}
.note{text-align:center;color:#72819a;font-size:11px;margin-top:10px}
#typing{color:#78b3ff;font-size:13px;padding:8px}
button:disabled{opacity:.5}
@media(max-width:500px){
 .welcome h1{font-size:25px}
 #chat{height:calc(100vh - 285px)}
 .msg{max-width:92%}
}
</style>
</head>

<body>

<header>
 <div class="logo">SFS <span>TalkBD</span></div>
 <div class="status" id="status">Connecting...</div>
</header>

<div class="container">

 <div class="welcome" id="welcome">
  <h1>Welcome to SFS TalkBD</h1>
  <p>তোমার প্রশ্ন করো, আমি উত্তর খুঁজে দেব।</p>
 </div>

 <div id="chat"></div>
 <div id="typing"></div>

 <div class="input-area">
  <div class="input-box">
   <input id="message" type="text"
    placeholder="Ask me"
    autocomplete="off">
   <button id="send">Send</button>
  </div>

  <div class="actions">
   <span style="font-size:11px;color:#8190aa">
    Smart Knowledge Assistant
   </span>
   <button id="clear">Clear Chat</button>
  </div>
  <div class="note">Powered by SFS</div>
 </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Configuration
const firebaseConfig = {
 apiKey: "AIzaSyC7S7tnI8yQeoiBAXhbSGa8OGT__NlK4cw",
 authDomain: "sfs-talkbd.firebaseapp.com",
 projectId: "sfs-talkbd",
 storageBucket: "sfs-talkbd.firebasestorage.app",
 messagingSenderId: "623575986195",
 appId: "1:623575986195:web:7222ca29d1f0f4bd418fe6"
};

// Firebase Initialize
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");
const status = document.getElementById("status");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

let knowledge = [];
let loading = false;

// Text normalization
function normalize(text){
 return String(text || "")
 .toLowerCase()
 .normalize("NFC")
 .replace(/[?!.,،。ঃ:;'"()\-]/g," ")
 .replace(/\s+/g," ")
 .trim();
}

// Database থেকে Knowledge Load
async function loadKnowledge(){
 try{
  status.textContent="Connecting...";

  const snapshot = await getDocs(
   collection(db,"knowledge")
  );

  knowledge = snapshot.docs.map(doc=>doc.data())
   .filter(item=>item.question && item.answer);

  status.textContent="● Online";
  status.style.color="#69e6a2";

  if(knowledge.length===0){
   status.textContent="No knowledge found";
  }

 }catch(error){
  console.error(error);
  status.textContent="Database Error";
  status.style.color="#ff7777";
 }
}

// Question Matching
function findAnswer(question){

 const q = normalize(question);
 const words = q.split(" ").filter(w=>w.length>1);

 let best = null;
 let bestScore = 0;

 for(const item of knowledge){

  const questionText = normalize(item.question);
  const keywords = Array.isArray(item.keywords)
   ? item.keywords.map(normalize)
   : typeof item.keywords==="string"
   ? item.keywords.split(",").map(normalize)
   : [];

  let score = 0;

  // Exact question
  if(q===questionText){
   score=100;
  }else{

   // Question word matching
   for(const word of words){
    if(questionText.includes(word)){
     score+=3;
    }
   }

   // Keyword matching
   for(const keyword of keywords){
    if(keyword && q.includes(keyword)){
     score+=5;
    }else if(keyword && words.some(w=>keyword.includes(w))){
     score+=2;
    }
   }

   // Partial phrase matching
   if(q.includes(questionText) && questionText.length>2){
    score+=8;
   }
  }

  if(score>bestScore){
   bestScore=score;
   best=item;
  }
 }

 // Minimum matching score
 if(best && bestScore>=5){
  return best.answer;
 }

 return "দুঃখিত! এই প্রশ্নের উত্তর আমার Database-এ শাহরিয়ার ফয়সাল সাদ এখনো Add করেনি । অন্যভাবে প্রশ্নটি লিখে দেখতে পারো।";
}

// Chat Display
function addMessage(text,type){
 welcome.style.display="none";

 const div=document.createElement("div");
 div.className="msg "+type;

 if(type==="bot"){
  const label=document.createElement("small");
  label.textContent="SFS TalkBD";
  div.appendChild(label);
  div.appendChild(document.createElement("br"));
 }

 const content=document.createElement("span");
 content.textContent=text;
 div.appendChild(content);

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;

 saveHistory();
}

// History Save
function saveHistory(){
 const history=[...chat.children].map(item=>({
  text:item.innerText.replace(/^SFS TalkBD\n?/,""),
  type:item.classList.contains("user")?"user":"bot"
 }));

 try{
  localStorage.setItem("sfs_history",JSON.stringify(history));
 }catch(e){}
}

// History Load
function loadHistory(){
 try{
  const history=JSON.parse(
   localStorage.getItem("sfs_history") || "[]"
  );

  history.forEach(item=>{
   addMessage(item.text,item.type);
  });
 }catch(e){}
}

// Send Message
async function sendMessage(){

 const question=input.value.trim();

 if(!question || loading)return;

 if(knowledge.length===0){
  addMessage("Database এখনো প্রস্তুত নয়। কিছুক্ষণ পর আবার চেষ্টা করো।","bot");
  return;
 }

 loading=true;
 send.disabled=true;

 addMessage(question,"user");
 input.value="";

 typing.textContent="SFS TalkBD is thinking...";

 // Matching
 await new Promise(resolve=>setTimeout(resolve,350));

 const answer=findAnswer(question);

 typing.textContent="";
 addMessage(answer,"bot");

 loading=false;
 send.disabled=false;
 input.focus();
}

// Events
send.addEventListener("click",sendMessage);

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

document.getElementById("clear").addEventListener("click",()=>{
 chat.innerHTML="";
 localStorage.removeItem("sfs_history");
 welcome.style.display="block";
});

loadKnowledge();
loadHistory();

</script>
</body>
</html>
